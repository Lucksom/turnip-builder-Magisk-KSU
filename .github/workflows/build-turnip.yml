name: Package Balemuni Turnip Modules

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip zip

      - name: 📥 Download Balemuni Releases (Universal & Ultimate)
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/Balemuni/Balemunis-Aurora/releases/latest)
          
          URL_UNIV=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("UNIVERSAL"; "i")) | .browser_download_url' | head -n 1)
          URL_ULTI=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("ULTIMATE"; "i")) | .browser_download_url' | head -n 1)
          
          if [ -z "$URL_UNIV" ] || [ "$URL_UNIV" == "null" ]; then
            echo "Error: Universal asset not found."
            exit 1
          fi
          
          if [ -z "$URL_ULTI" ] || [ "$URL_ULTI" == "null" ]; then
            echo "Error: Ultimate asset not found."
            exit 1
          fi
          
          curl -L -o universal_input.zip "$URL_UNIV"
          curl -L -o ultimate_input.zip "$URL_ULTI"

      - name: 📦 Build Universal Module (SD 8 Elite / A8xx / A7xx / A6xx)
        run: |
          mkdir -p work_univ/extracted
          unzip -q universal_input.zip -d work_univ/extracted/
          DRIVER=$(find work_univ/extracted/ -type f -name "*.so" | head -n 1)
          
          mkdir -p work_univ/module/system/vendor/lib64/hw
          mkdir -p work_univ/module/META-INF/com/google/android
          
          cp "$DRIVER" work_univ/module/system/vendor/lib64/hw/vulkan.adreno.so
          
          cat <<EOF > work_univ/module/module.prop
          id=turnip-balemuni-universal
          name=Turnip Mesa (Balemuni Apex - Universal)
          version=Apex-$(date +%Y%m%d)
          versionCode=$(date +%Y%m%d)
          author=Balemuni (Packaged by GitHub-Actions)
          description=System-wide Turnip Vulkan driver for Adreno 6xx, 7xx, and 8xx (Snapdragon 8 Elite).
          EOF
          
          echo "#MAGISK" > work_univ/module/META-INF/com/google/android/updater-script
          
          cat << 'EOF' > work_univ/module/META-INF/com/google/android/update-binary
          #!/system/bin/sh
          OUTFD=$2
          ZIPFILE=$3
          . /data/adb/magisk/util_functions.sh
          [ $MAGISK_VER_CODE -lt 25200 ] && require_new_magisk
          install_module
          exit 0
          EOF
          
          chmod +x work_univ/module/META-INF/com/google/android/update-binary
          
          cd work_univ/module
          zip -r9 ../../Turnip-Apex-Universal-$(date +%Y%m%d).zip .
          cd ../../

      - name: 📦 Build Ultimate Module (Snapdragon 8 Gen 2 / A740)
        run: |
          mkdir -p work_ulti/extracted
          unzip -q ultimate_input.zip -d work_ulti/extracted/
          DRIVER=$(find work_ulti/extracted/ -type f -name "*.so" | head -n 1)
          
          mkdir -p work_ulti/module/system/vendor/lib64/hw
          mkdir -p work_ulti/module/META-INF/com/google/android
          
          cp "$DRIVER" work_ulti/module/system/vendor/lib64/hw/vulkan.adreno.so
          
          cat <<EOF > work_ulti/module/module.prop
          id=turnip-balemuni-ultimate
          name=Turnip Mesa (Balemuni Apex - Ultimate SD8G2)
          version=Apex-$(date +%Y%m%d)
          versionCode=$(date +%Y%m%d)
          author=Balemuni (Packaged by GitHub-Actions)
          description=System-wide Turnip Vulkan driver optimized for Snapdragon 8 Gen 2 (Adreno 740).
          EOF
          
          echo "#MAGISK" > work_ulti/module/META-INF/com/google/android/updater-script
          
          cat << 'EOF' > work_ulti/module/META-INF/com/google/android/update-binary
          #!/system/bin/sh
          OUTFD=$2
          ZIPFILE=$3
          . /data/adb/magisk/util_functions.sh
          [ $MAGISK_VER_CODE -lt 25200 ] && require_new_magisk
          install_module
          exit 0
          EOF
          
          chmod +x work_ulti/module/META-INF/com/google/android/update-binary
          
          cd work_ulti/module
          zip -r9 ../../Turnip-Apex-Ultimate-SD8G2-$(date +%Y%m%d).zip .
          cd ../../

      # NEW STEP: Generate the date safely into an environment variable
      - name: 🏷️ Set Release Tag variables
        run: |
          echo "TAG_NAME=v$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
          echo "RELEASE_NAME=Turnip Apex Flashable Modules ($(date +%Y-%m-%d))" >> $GITHUB_ENV

      # UPDATED STEP: v3 used to fix Node 20 deprecation, uses env variables safely
      - name: 🚀 Publish Both Modules to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Automated flashable builds for Magisk and KernelSU based on Balemuni's latest release.
            
            ### Included Files:
            * **Turnip-Apex-Universal**: Supports Adreno 6xx, 7xx, and 8xx (Snapdragon 8 Elite / A810, A825, A830).
            * **Turnip-Apex-Ultimate-SD8G2**: Optimized specifically for Snapdragon 8 Gen 2 (Adreno 740).
          files: |
            Turnip-Apex-Universal-*.zip
            Turnip-Apex-Ultimate-SD8G2-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
