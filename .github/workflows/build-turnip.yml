name: Package Balemuni Turnip for Magisk / KSU

on:
  workflow_dispatch:

jobs:
  package-module:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip zip

      - name: 📥 Download Latest Balemuni Universal Release
        run: |
          # Fetch the latest release metadata from GitHub API
          RELEASE_JSON=$(curl -s https://api.github.com/repos/Balemuni/Balemunis-Aurora/releases/latest)
          
          # Find the download URL for the UNIVERSAL zip file
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | contains("UNIVERSAL")) | .browser_download_url' | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Error: Could not find Universal zip file in latest release."
            exit 1
          fi
          
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -o turnip_input.zip "$DOWNLOAD_URL"

      - name: 📦 Build Magisk & KernelSU Module
        run: |
          # Extract the emulator driver zip
          mkdir -p extracted
          unzip -q turnip_input.zip -d extracted/
          
          # Find the compiled .so driver file
          DRIVER_FILE=$(find extracted/ -type f -name "*.so" | head -n 1)
          
          if [ -z "$DRIVER_FILE" ]; then
            echo "Error: No .so driver file found in the archive."
            exit 1
          fi
          
          echo "Found driver library: $DRIVER_FILE"
          
          # Create standard Magisk / KSU filesystem structure
          mkdir -p module/system/vendor/lib64/hw
          mkdir -p module/META-INF/com/google/android
          
          # Copy and rename driver to replace system Adreno Vulkan
          cp "$DRIVER_FILE" module/system/vendor/lib64/hw/vulkan.adreno.so
          
          # 1. Create module.prop
          cat <<EOF > module/module.prop
          id=turnip-balemuni-universal
          name=Turnip Mesa (Balemuni Apex Universal - A8xx/A7xx/A6xx)
          version=Apex-$(date +%Y%m%d)
          versionCode=$(date +%Y%m%d)
          author=Balemuni (Packaged by GitHub-Actions)
          description=System-wide Turnip Mesa Vulkan driver with full Adreno 8-series (SD 8 Elite), 7-series, and 6-series support.
          EOF
          
          # 2. Create updater-script
          echo "#MAGISK" > module/META-INF/com/google/android/updater-script
          
          # 3. Create update-binary
          cat << 'EOF' > module/META-INF/com/google/android/update-binary
          #!/system/bin/sh
          OUTFD=$2
          ZIPFILE=$3
          . /data/adb/magisk/util_functions.sh
          [ $MAGISK_VER_CODE -lt 25200 ] && require_new_magisk
          install_module
          exit 0
          EOF
          
          chmod +x module/META-INF/com/google/android/update-binary
          
          # Zip the final flashable module
          cd module
          zip -r9 ../Turnip-Apex-Universal-Magisk-$(date +%Y%m%d).zip .

      - name: 🚀 Upload Flashable Module
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Apex-Universal-Magisk
          path: Turnip-Apex-Universal-Magisk-*.zip
