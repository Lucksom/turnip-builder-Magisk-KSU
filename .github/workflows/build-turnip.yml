name: Package Balemuni Turnip Modules (Universal & Ultimate)

on:
  workflow_dispatch:

jobs:
  build-modules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - name: Universal
            filter: UNIVERSAL
            desc: "All Adreno GPUs (A6xx, A7xx, A8xx / SD 8 Elite)"
          - name: Ultimate-SD8Gen2
            filter: ULTIMATE
            desc: "Optimized for Snapdragon 8 Gen 2 / Adreno 740"

    steps:
      - name: 🛠️ Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip zip

      - name: 📥 Fetch and Download ${{ matrix.variant.name }}
        run: |
          # Query GitHub API for the latest Balemuni release
          RELEASE_JSON=$(curl -s https://api.github.com/repos/Balemuni/Balemunis-Aurora/releases/latest)
          
          # Match the download URL based on matrix filter
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r --arg FILTER "${{ matrix.variant.filter }}" '.assets[] | select(.name | test($FILTER; "i")) | .browser_download_url' | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Error: Could not find asset matching ${{ matrix.variant.filter }}"
            exit 1
          fi
          
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -o driver_input.zip "$DOWNLOAD_URL"

      - name: 📦 Convert to Flashable Magisk / KernelSU Module
        run: |
          mkdir -p extracted
          unzip -q driver_input.zip -d extracted/
          
          # Find the driver library (.so)
          DRIVER_FILE=$(find extracted/ -type f -name "*.so" | head -n 1)
          
          if [ -z "$DRIVER_FILE" ]; then
            echo "Error: No .so driver file found in the archive."
            exit 1
          fi
          
          echo "Extracted driver file: $DRIVER_FILE"
          
          # Create Magisk / KSU directory tree
          mkdir -p module/system/vendor/lib64/hw
          mkdir -p module/META-INF/com/google/android
          
          # Overwrite system Adreno Vulkan driver
          cp "$DRIVER_FILE" module/system/vendor/lib64/hw/vulkan.adreno.so
          
          # Create module properties
          cat <<EOF > module/module.prop
          id=turnip-balemuni-${{ matrix.variant.name }}
          name=Turnip Mesa (Balemuni Apex - ${{ matrix.variant.name }})
          version=Apex-$(date +%Y%m%d)
          versionCode=$(date +%Y%m%d)
          author=Balemuni (Packaged by GitHub-Actions)
          description=System-wide Turnip Vulkan driver (${{ matrix.variant.desc }}). Flashable via Magisk / KernelSU.
          EOF
          
          # Create installer scripts
          echo "#MAGISK" > module/META-INF/com/google/android/updater-script
          
          cat << 'EOF' > module/META-INF/com/google/android/update-binary
          #!/system/bin/sh
          OUTFD=$2
          ZIPFILE=$3
          . /data/adb/magisk/util_functions.sh
          [ $MAGISK_VER_CODE -lt 25200 ] && require_new_magisk
          install_module
          exit 0
          EOF
          
          chmod +x module/META-INF/com/google/android/update-binary
          
          # Create flashable zip
          cd module
          zip -r9 ../Turnip-Balemuni-${{ matrix.variant.name }}-$(date +%Y%m%d).zip .

      - name: 🚀 Upload Flashable Module
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Balemuni-${{ matrix.variant.name }}-Flashable
          path: Turnip-Balemuni-*.zip
